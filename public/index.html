<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>UYAN Inventory</title><style>
:root{--gold:#c8a951;--bg:#f5f5f2;--ink:#171717;--muted:#6f6f6f;--card:#fff;--danger:#b42318;--ok:#18794e;--line:#e5e2d8}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#111}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:28px;text-align:center}.login-card img{width:170px;max-height:120px;object-fit:contain}.field{display:grid;gap:6px;margin:12px 0;text-align:left}.field input,.field select{padding:12px;border:1px solid var(--line);border-radius:10px}.primary{background:var(--gold);color:#111;padding:12px 16px;border-radius:10px;font-weight:700}.app{min-height:100vh}.top{height:70px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:48px;object-fit:contain}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}aside{background:#181818;color:#fff;padding:14px;display:flex;flex-direction:column;gap:6px}.nav{padding:11px 12px;background:transparent;color:#ddd;text-align:left;border-radius:9px}.nav.active,.nav:hover{background:#2a2a2a;color:#fff}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.form-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.metric{font-size:28px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.danger{color:var(--danger)}.ok{color:var(--ok)}.section{margin-top:18px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{background:#faf9f4}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}.pill.low{background:#fee4e2;color:var(--danger)}.pill.warn{background:#fff0c2;color:#765500}.pill.ok{background:#def7ec;color:var(--ok)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:9px}.secondary{background:#eee;padding:10px 13px;border-radius:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.alert-list{display:grid;gap:8px}.alert{border-left:4px solid var(--danger);background:#fff;padding:12px;border-radius:8px;border:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}.modal-card{background:#fff;border-radius:16px;width:min(600px,100%);padding:20px;max-height:90vh;overflow:auto}.close{background:#eee;border-radius:50%;width:34px;height:34px}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 15px;border-radius:10px;z-index:30;display:none}.mobile-nav{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111;padding:7px;z-index:10;gap:4px;overflow:auto}.mobile-nav .nav{flex:1;min-width:82px;text-align:center;font-size:11px}.main{padding:15px 12px 85px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.top{height:62px}.brand img{width:48px;height:40px}}@media print{.top,aside,.mobile-nav,.toolbar,.no-print,.page-title button{display:none!important}.layout{display:block}.main{padding:0;max-width:none}.table-wrap{border:0}.table{min-width:0}.table th,.table td{padding:7px}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><img src="assets/uyan_logo.png"><h1>UYAN Inventory</h1><p>Shared Restaurant Stock Control</p><div class="field"><label>Username</label><input id="user" value="admin"></div><div class="field"><label>Password</label><input id="pass" type="password" value="admin123"></div><button class="primary" style="width:100%" onclick="login()">Sign in</button><p class="muted">Demo accounts: admin/admin123 · storekeeper/store123</p></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand"><img src="assets/uyan_logo.png"><div><b>UYAN Inventory</b><br><small id="role"></small></div></div><button class="secondary" onclick="logout()">Sign out</button></header><div class="layout"><aside id="side"></aside><main class="main" id="content"></main></div><nav class="mobile-nav" id="mobile"></nav></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script>
let token=localStorage.getItem('uyan_token'),me=JSON.parse(localStorage.getItem('uyan_user')||'null'),S={items:[],issues:[],supplies:[],movements:[],low:[]},page='dashboard';
const nav=[['dashboard','Dashboard'],['food','🍽️ Food Stock'],['drinks','🍹 Drinks / Bar'],['supplies','📦 New Supplies'],['issues','🧾 Daily Issues'],['alerts','🔔 Low Stock'],['reports','📊 Weekly Reports']];
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};let r=await fetch(path,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({username:v('user'),password:v('pass')})});token=d.token;me=d.user;localStorage.setItem('uyan_token',token);localStorage.setItem('uyan_user',JSON.stringify(me));show();await refresh();events()}catch(e){alert(e.message)}}
function logout(){localStorage.clear();location.reload()} function v(id){return document.getElementById(id)?.value||''}
async function refresh(){S=await api('/api/state');render()}
function show(){loginEl().classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('role').textContent=me.name+' · '+me.role}
function loginEl(){return document.getElementById('login')}
function events(){let es=new EventSource('/api/events?token='+token);es.onmessage=async()=>{await refresh();toast('Updated from another device')};es.onerror=()=>{es.close();setTimeout(events,3000)}}
function renderNav(){let h=nav.map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');if(me.role==='admin')h+='<button class="nav" onclick="resetData()">Reset Demo</button>';side.innerHTML=h;mobile.innerHTML=h}
function go(p){page=p;render()} function render(){renderNav();let c=document.getElementById('content');({dashboard,food,drinks,supplies,issues,alerts,reports}[page]||dashboard)(c)}
function dashboard(c){let low=S.low,t=today(),tod=S.issues.filter(x=>x.date===t),pending=S.supplies.filter(x=>!x.confirmed);c.innerHTML=`<div class="page-title"><h2>Dashboard</h2><span class="muted">${new Date().toLocaleDateString()}</span></div><div class="cards"><div class="card"><div class="muted">Food Items</div><div class="metric">${S.items.filter(i=>i.cat==='Food').length}</div></div><div class="card"><div class="muted">Drinks Items</div><div class="metric">${S.items.filter(i=>i.cat==='Drinks').length}</div></div><div class="card"><div class="muted">Low Stock</div><div class="metric danger">${low.length}</div></div><div class="card"><div class="muted">Pending Supplies</div><div class="metric">${pending.length}</div></div></div><div class="section grid2"><div class="form-card"><h3>🔔 Low Stock Alerts</h3>${low.length?'<div class="alert-list">'+low.map(i=>`<div class="alert"><b>${i.qty===0?'🚨 OUT OF STOCK':'🔴 LOW STOCK'} — ${i.cat} #${i.number} ${i.name}</b><br>${i.qty} ${i.unit} remaining · minimum ${i.min}</div>`).join('')+'</div>':'<p class="ok">All stock levels are healthy.</p>'}</div><div class="form-card"><h3>📦 Supplies awaiting confirmation</h3>${pending.length?'<div class="alert-list">'+pending.slice().reverse().slice(0,6).map(x=>`<div class="alert" style="border-left-color:#c8a951"><b>${x.category} #${x.itemNumber} ${x.item}</b><br>${x.received} ${x.unit} from ${x.supplier||'—'}<br><button class="secondary no-print" onclick="confirmSupply(${x.id})">Confirm Receipt</button></div>`).join('')+'</div>':'<p class="ok">No pending deliveries.</p>'}</div></div>`}
function stockPage(c,cat){let items=S.items.filter(i=>i.cat===cat).sort((a,b)=>a.number-b.number);c.innerHTML=`<div class="page-title"><h2>${cat==='Food'?'🍽️ Food Stock':'🍹 Drinks / Bar Stock'}</h2><button class="primary" onclick="addItem('${cat}')">+ Add New ${cat==='Food'?'Food':'Drink'} Item</button></div><p class="muted">Item numbers are permanent. New items receive the next number and old numbers are never reused.</p><div class="table-wrap"><table class="table"><thead><tr><th>No.</th><th>Item</th><th>Opening Stock</th><th>New Stock</th><th>Total Stock</th><th>Issued Today</th><th>Balance</th><th>Low Stock</th><th>Action</th></tr></thead><tbody>${items.map(i=>`<tr><td><b>${i.number}</b></td><td><b>${i.name}</b></td><td>${i.openingStock} ${i.unit}</td><td>${i.newStock} ${i.unit}</td><td>${i.totalStock} ${i.unit}</td><td>${i.issuedToday} ${i.unit}</td><td>${i.balance} ${i.unit}</td><td>${i.balance===0?'<span class="pill low">OUT</span>':i.balance<=i.min?'<span class="pill low">LOW</span>':i.balance<=i.min*1.25?'<span class="pill warn">WATCH</span>':'<span class="pill ok">OK</span>'}</td><td><button class="secondary" onclick="adjust(${i.id})">Adjust</button></td></tr>`).join('')||`<tr><td colspan="9">No ${cat.toLowerCase()} items.</td></tr>`}</tbody></table></div>`}
function food(c){stockPage(c,'Food')} function drinks(c){stockPage(c,'Drinks')}
function addItem(cat){modal(`<h3>Add New ${cat==='Food'?'Food':'Drink'} Item</h3><p class="muted">The system will automatically assign the next permanent number.</p>${field('Item name','name')}${field('Unit','unit')}${field('Opening stock','qty','number')}${field('Low-stock minimum','min','number')}<button class="primary" onclick="saveItem('${cat}')">Add Item</button>`)}
function field(l,id,t='text'){return `<div class="field"><label>${l}</label><input id="${id}" type="${t}"></div>`}
async function saveItem(cat){try{await api('/api/items',{method:'POST',body:JSON.stringify({name:v('name'),cat,unit:v('unit'),qty:v('qty'),min:v('min')})});close();await refresh();toast('Item added with permanent number')}catch(e){toast(e.message)}}
function adjust(id){let i=S.items.find(x=>x.id===id);modal(`<h3>Stock Adjustment — ${i.cat} #${i.number} ${i.name}</h3>${field('Adjustment (+/-)','a','number')}${field('Reason','reason')}<button class="primary" onclick="saveAdjust(${id})">Save Adjustment</button>`)}
async function saveAdjust(id){try{await api('/api/items/'+id+'/adjust',{method:'POST',body:JSON.stringify({adjustment:v('a'),reason:v('reason')})});close();await refresh();toast('Adjustment saved')}catch(e){toast(e.message)}}
function supplies(c){let pending=S.supplies.filter(x=>!x.confirmed).slice().reverse(),done=S.supplies.filter(x=>x.confirmed).slice().reverse();c.innerHTML=`<div class="page-title"><h2>📦 New Supplies / Stock Received</h2><button class="primary" onclick="newSupply()">+ Record New Supply</button></div><div class="form-card"><h3>Pending Confirmation</h3><p class="muted">Stock is NOT added to inventory until receipt is confirmed.</p><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>No.</th><th>Item</th><th>From</th><th>Expected</th><th>Received</th><th>Amount</th><th>Recorded By</th><th>Action</th></tr></thead><tbody>${pending.map(x=>`<tr><td>${x.date}</td><td>${x.itemNumber}</td><td>${x.item}</td><td>${x.supplier}</td><td>${x.expected} ${x.unit}</td><td>${x.received} ${x.unit}${x.received<x.expected?' <span class=\"pill warn\">SHORT</span>':''}</td><td>₦${x.amount.toLocaleString()}</td><td>${x.recordedBy}</td><td><button class="secondary" onclick="confirmSupply(${x.id})">Confirm Receipt</button></td></tr>`).join('')||'<tr><td colspan="9">No pending supplies.</td></tr>'}</tbody></table></div></div><div class="section form-card"><h3>Confirmed Supplies</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Category</th><th>No.</th><th>Item</th><th>From</th><th>Received</th><th>Amount</th><th>Confirmed By</th></tr></thead><tbody>${done.map(x=>`<tr><td>${x.date}</td><td>${x.category}</td><td>${x.itemNumber}</td><td>${x.item}</td><td>${x.supplier}</td><td>${x.received} ${x.unit}</td><td>₦${x.amount.toLocaleString()}</td><td>${x.confirmedBy}</td></tr>`).join('')||'<tr><td colspan="8">No confirmed supplies.</td></tr>'}</tbody></table></div></div>`}
function newSupply(){modal(`<h3>Record New Supply</h3><div class="field"><label>Stock Area</label><select id="scat" onchange="supplyItems()"><option>Food</option><option>Drinks</option></select></div><div class="field"><label>Item</label><select id="si"></select></div>${field('Supplier / person it came from','supplier')}${field('Quantity expected','expected','number')}${field('Quantity actually received','received','number')}${field('Amount paid','amount','number')}${field('Receipt / invoice number (optional)','receiptNo')}${field('Notes (optional)','notes')}<button class="primary" onclick="saveSupply()">Save as Pending</button>`);supplyItems()}
function supplyItems(){let cat=v('scat'),a=S.items.filter(i=>i.cat===cat).sort((x,y)=>x.number-y.number);let el=document.getElementById('si');if(el)el.innerHTML=a.map(i=>`<option value="${i.id}">#${i.number} ${i.name} (${i.unit})</option>`).join('')}
async function saveSupply(){try{await api('/api/supplies',{method:'POST',body:JSON.stringify({itemId:v('si'),supplier:v('supplier'),expected:v('expected'),received:v('received'),amount:v('amount'),receiptNo:v('receiptNo'),notes:v('notes')})});close();await refresh();toast('Supply recorded and awaiting confirmation')}catch(e){toast(e.message)}}
async function confirmSupply(id){try{await api('/api/supplies/'+id+'/confirm',{method:'POST'});await refresh();toast('Supply confirmed and added to stock')}catch(e){toast(e.message)}}
function issues(c){let d=today();c.innerHTML=`<div class="page-title"><h2>🧾 Daily Stock Issues</h2><button class="primary" onclick="issue()">+ Issue Stock</button></div><div class="toolbar"><input id="idate" type="date" value="${d}" onchange="issueTable()"><select id="idept" onchange="issueTable()"><option value="">All Areas</option><option>Kitchen</option><option>Bar</option></select><input id="ireceiver" placeholder="Filter chef / bar staff" oninput="issueTable()"><button class="secondary" onclick="printIssues()">🖨 Print Selected Sheet</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Area</th><th>No.</th><th>Item</th><th>Qty</th><th>Chef / Bar Staff</th><th>Issued By</th><th>Confirmation</th><th>Signature</th></tr></thead><tbody id="itb"></tbody></table></div>`;issueTable()}
function issueTable(){let d=v('idate'),dep=v('idept'),rec=v('ireceiver').toLowerCase(),a=S.issues.filter(x=>x.date===d&&(!dep||x.department===dep)&&(!rec||(x.receiver||'').toLowerCase().includes(rec))).slice().reverse();document.getElementById('itb').innerHTML=a.map(x=>`<tr><td>${x.date}</td><td>${x.department}</td><td>${x.itemNumber}</td><td>${x.item}</td><td>${x.qty} ${x.unit}</td><td>${x.receiver||'—'}</td><td>${x.by}</td><td>${x.confirmed?'<span class="pill ok">Confirmed</span>':`<button class="secondary no-print" onclick="confirmIssue(${x.id})">Confirm</button>`}</td><td>________________</td></tr>`).join('')||'<tr><td colspan="9">No matching issues.</td></tr>'}

function printIssues(){let d=v('idate'),dep=v('idept'),rec=v('ireceiver').trim();if(!rec){alert('Enter a Chef or Bar staff name first, then print that person’s sheet.');return}let rows=S.issues.filter(x=>x.date===d&&(!dep||x.department===dep)&&((x.receiver||'').toLowerCase()===rec.toLowerCase()));if(!rows.length){alert('No issues found for this person on the selected date.');return}let area=dep||rows[0].department;let w=window.open('','_blank');w.document.write(`<html><head><title>UYAN Daily Issue Sheet</title><style>body{font-family:Arial;padding:24px}h1{text-align:center;margin-bottom:4px}h2{text-align:center;margin-top:0}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #222;padding:8px;text-align:left}th{background:#eee}.sign{margin-top:40px;display:flex;justify-content:space-between}</style></head><body><h1>UYAN RESTAURANT BAR & LOUNGE</h1><h2>DAILY ${area.toUpperCase()} ISSUE SHEET</h2><p><b>Date:</b> ${d} &nbsp;&nbsp; <b>Receiver:</b> ${rec} &nbsp;&nbsp; <b>Area:</b> ${area}</p><table><thead><tr><th>No.</th><th>Item</th><th>Quantity</th><th>Unit</th><th>Issued By</th><th>Confirmed</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.itemNumber}</td><td>${x.item}</td><td>${x.qty}</td><td>${x.unit}</td><td>${x.by}</td><td>${x.confirmed?'Yes':'Pending'}</td></tr>`).join('')}</tbody></table><div class='sign'><div>Storekeeper: __________________</div><div>Receiver: __________________</div></div></body></html>`);w.document.close();w.focus();w.print()}

function issue(){modal(`<h3>Issue Stock</h3><div class="field"><label>Stock Area</label><select id="idep2" onchange="issueItems()"><option>Kitchen</option><option>Bar</option></select></div><div class="field"><label>Item</label><select id="ii"></select></div>${field('Quantity','iq','number')}${field('Chef name / Bar staff name','rec')}<button class="primary" onclick="saveIssue()">Record Issue</button>`);issueItems()}
function issueItems(){let cat=v('idep2')==='Bar'?'Drinks':'Food',a=S.items.filter(i=>i.cat===cat&&i.qty>0).sort((x,y)=>x.number-y.number);let el=document.getElementById('ii');if(el)el.innerHTML=a.map(i=>`<option value="${i.id}">#${i.number} ${i.name} (${i.qty} ${i.unit} available)</option>`).join('')}
async function saveIssue(){try{await api('/api/issues',{method:'POST',body:JSON.stringify({itemId:v('ii'),qty:v('iq'),department:v('idep2'),receiver:v('rec')})});close();await refresh();toast('Issue recorded')}catch(e){toast(e.message)}}
async function confirmIssue(id){try{await api('/api/issues/'+id+'/confirm',{method:'POST'});await refresh();toast('Issue confirmed')}catch(e){toast(e.message)}}
function alerts(c){let f=S.low.filter(i=>i.cat==='Food'),d=S.low.filter(i=>i.cat==='Drinks');c.innerHTML=`<div class="page-title"><h2>🔔 Low Stock Alerts</h2></div><div class="grid2"><div class="form-card"><h3>🍽️ Food</h3>${alertList(f)}</div><div class="form-card"><h3>🍹 Drinks / Bar</h3>${alertList(d)}</div></div>`}function alertList(a){return a.length?'<div class="alert-list">'+a.map(i=>`<div class="alert"><b>${i.qty===0?'🚨 OUT OF STOCK':'🔴 LOW STOCK'} — #${i.number} ${i.name}</b><br>${i.qty} ${i.unit} remaining · minimum ${i.min}</div>`).join('')+'</div>':'<p class="ok">No low-stock items.</p>'}
async function reports(c){let r=await api('/api/reports/weekly');c.innerHTML=`<div class="page-title"><h2>📊 Weekly Report</h2><button class="secondary" onclick="window.print()">🖨 Print / Save PDF</button></div><div class="cards"><div class="card"><span class="muted">Movements</span><div class="metric">${r.movements.length}</div></div><div class="card"><span class="muted">Confirmed Supplies</span><div class="metric">${r.supplies.filter(x=>x.confirmed).length}</div></div><div class="card"><span class="muted">Issues</span><div class="metric">${r.issues.length}</div></div><div class="card"><span class="muted">Low Stock</span><div class="metric danger">${r.low.length}</div></div></div><div class="section grid2"><div class="form-card"><h3>Food Supply & Issues</h3>${reportTable(r,'Food')}</div><div class="form-card"><h3>Drinks Supply & Issues</h3>${reportTable(r,'Drinks')}</div></div>`}
function reportTable(r,cat){let items=S.items.filter(i=>i.cat===cat).sort((a,b)=>a.number-b.number);return `<div class="table-wrap"><table class="table"><thead><tr><th>No.</th><th>Item</th><th>Opening</th><th>New Supply</th><th>Issued</th><th>Balance</th><th>Status</th></tr></thead><tbody>${items.map(i=>{let sup=r.supplies.filter(s=>s.itemId===i.id&&s.confirmed).reduce((a,s)=>a+s.received,0),iss=r.issues.filter(x=>x.itemId===i.id).reduce((a,x)=>a+x.qty,0),bal=i.qty;return `<tr><td>${i.number}</td><td>${i.name}</td><td>${i.qty+iss-sup}</td><td>${sup}</td><td>${iss}</td><td>${bal}</td><td>${bal<=i.min?'<span class="pill low">LOW</span>':'<span class="pill ok">OK</span>'}</td></tr>`}).join('')}</tbody></table></div>`}
function today(){return new Date().toISOString().slice(0,10)}async function resetData(){if(confirm('Reset shared demo data?')){await api('/api/reset',{method:'POST'});await refresh();toast('Reset complete')}}function modal(b){document.getElementById('modal').innerHTML=`<div class="modal-card"><div style="text-align:right"><button class="close" onclick="close()">✕</button></div>${b}</div>`;document.getElementById('modal').classList.remove('hidden')}function close(){document.getElementById('modal').classList.add('hidden')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}
if(token&&me){show();refresh().catch(()=>logout());events()}
</script></body></html>
