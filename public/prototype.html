<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UYAN Inventory</title>

<style>
:root{
  --gold:#c8a951;
  --orange:#f0a500;
  --bg:#090909;
  --card:#151515;
  --text:#fff;
  --muted:#aaa;
  --danger:#e74c3c;
  --green:#35c46a;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:#111;
  border-bottom:1px solid var(--gold);
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:5;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:var(--gold);
}

#clock{
  color:#fff;
  font-size:14px;
  text-align:right;
}

nav{
  display:flex;
  gap:6px;
  padding:10px;
  overflow-x:auto;
  background:#0d0d0d;
}

nav button{
  background:#1b1b1b;
  color:#fff;
  border:1px solid #333;
  padding:10px 14px;
  border-radius:8px;
  white-space:nowrap;
}

nav button.active,
nav button:hover{
  background:var(--gold);
  color:#000;
}

main{
  padding:15px;
  max-width:1100px;
  margin:auto;
}

.card{
  background:var(--card);
  border:1px solid #292929;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

h1,h2,h3{
  margin-top:0;
  color:var(--gold);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.stat{
  background:#1a1a1a;
  border-left:4px solid var(--gold);
  padding:15px;
  border-radius:8px;
}

.stat b{
  display:block;
  font-size:28px;
  margin-top:6px;
}

input,select{
  width:100%;
  padding:11px;
  margin:6px 0;
  background:#090909;
  color:#fff;
  border:1px solid #444;
  border-radius:7px;
}

button{
  cursor:pointer;
}

.btn{
  background:var(--gold);
  color:#000;
  border:0;
  padding:10px 14px;
  border-radius:7px;
  font-weight:bold;
  margin:4px 2px;
}

.btn:hover{
  background:var(--orange);
}

.btn.danger{
  background:var(--danger);
  color:#fff;
}

.btn.green{
  background:var(--green);
  color:#000;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:11px 7px;
  border-bottom:1px solid #333;
  text-align:left;
}

th{
  color:var(--gold);
}

.badge{
  padding:4px 8px;
  border-radius:20px;
  background:#222;
}

.low{
  color:#ff6b5f;
  font-weight:bold;
}

.good{
  color:#4ade80;
  font-weight:bold;
}

.hidden{
  display:none!important;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  padding:20px;
}

.modal-box{
  background:#171717;
  border:1px solid var(--gold);
  border-radius:12px;
  padding:20px;
  width:100%;
  max-width:430px;
}

@media(max-width:600px){
  main{padding:10px}
  table{font-size:13px}
  th,td{padding:8px 5px}
}
</style>
</head>

<body>

<header>
  <div class="logo">UYAN</div>
  <div id="clock"></div>
</header>

<nav>
  <button class="active" onclick="showPage('dashboard',this)">Dashboard</button>
  <button onclick="showPage('inventory',this)">Inventory</button>
  <button onclick="showPage('issues',this)">Issues</button>
  <button onclick="showPage('alerts',this)">Alerts</button>
  <button onclick="showPage('reports',this)">Reports</button>
</nav>

<main>

<section id="dashboard">
  <div class="card">
    <h1>UYAN Inventory Dashboard</h1>
    <p>Inventory management system</p>
  </div>

  <div class="grid">
    <div class="stat">
      Total Items
      <b id="totalItems">0</b>
    </div>

    <div class="stat">
      Total Stock
      <b id="totalStock">0</b>
    </div>

    <div class="stat">
      Low Stock
      <b id="lowStock">0</b>
    </div>

    <div class="stat">
      Stock Issued
      <b id="totalIssued">0</b>
    </div>
  </div>
</section>

<section id="inventory" class="hidden">

  <div class="card">
    <h2>Inventory</h2>

    <input id="newName" placeholder="Item name">

    <input id="newQty"
           type="text"
           inputmode="decimal"
           placeholder="Quantity e.g. 1, 2, 0.5, ½, 1½">

    <input id="newMinimum"
           type="text"
           inputmode="decimal"
           placeholder="Minimum stock">

    <button class="btn" onclick="addItem()">+ Add Inventory Item</button>
  </div>

  <div class="card">
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Stock</th>
            <th>Minimum</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
      </table>
    </div>
  </div>

</section>

<section id="issues" class="hidden">

  <div class="card">
    <h2>Issue Stock</h2>

    <select id="issueItem"></select>

    <input id="issueQty"
           type="text"
           inputmode="decimal"
           placeholder="Quantity e.g. ½ or 1½">

    <button class="btn green" onclick="issueStock()">Issue Stock</button>
  </div>

  <div class="card">
    <h2>Issue History</h2>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="issueTable"></tbody>
      </table>
    </div>
  </div>

</section>

<section id="alerts" class="hidden">

  <div class="card">
    <h2>Low Stock Alerts</h2>
    <div id="alertList"></div>
  </div>

</section>

<section id="reports" class="hidden">

  <div class="card">
    <h2>Inventory Report</h2>
    <p id="reportDate"></p>

    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Current Stock</th>
            <th>Minimum</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="reportTable"></tbody>
      </table>
    </div>
  </div>

</section>

</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2>Edit Item</h2>

    <input id="editName" placeholder="Item name">

    <input id="editQty"
           type="text"
           inputmode="decimal"
           placeholder="Quantity">

    <input id="editMinimum"
           type="text"
           inputmode="decimal"
           placeholder="Minimum stock">

    <button class="btn" onclick="saveEdit()">Save Changes</button>
    <button class="btn danger" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>

const KEY="uyan_inventory_web_v2";

let state=JSON.parse(localStorage.getItem(KEY)) || {
  items:[],
  issues:[]
};

let editingId=null;

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}

function numberValue(value){

  if(value===undefined || value===null) return 0;

  let s=String(value)
    .trim()
    .replace(/½/g,"0.5");

  let total=0;

  let parts=s.split(/\s+/);

  for(let p of parts){

    if(p.includes("/")){
      let a=p.split("/");
      if(a.length===2){
        total += Number(a[0])/Number(a[1]);
      }
    }else{
      let n=parseFloat(p);
      if(!isNaN(n)) total+=n;
    }
  }

  return total;
}

function displayQty(n){

  n=Number(n);

  if(n===0.5) return "½";

  if(Number.isInteger(n)) return String(n);

  let whole=Math.floor(n);
  let fraction=n-whole;

  if(Math.abs(fraction-0.5)<0.001){
    return whole ? whole+"½" : "½";
  }

  return String(Number(n.toFixed(2)));
}

function addItem(){

  let name=document.getElementById("newName").value.trim();
  let qty=numberValue(document.getElementById("newQty").value);
  let minimum=numberValue(document.getElementById("newMinimum").value);

  if(!name){
    alert("Please enter an item name.");
    return;
  }

  state.items.push({
    id:Date.now(),
    name:name,
    qty:qty,
    minimum:minimum
  });

  save();

  document.getElementById("newName").value="";
  document.getElementById("newQty").value="";
  document.getElementById("newMinimum").value="";

  renderAll();
}

function editItem(id){

  let item=state.items.find(x=>x.id===id);

  if(!item) return;

  editingId=id;

  document.getElementById("editName").value=item.name;
  document.getElementById("editQty").value=displayQty(item.qty);
  document.getElementById("editMinimum").value=displayQty(item.minimum);

  document.getElementById("modal").classList.remove("hidden");
}

function saveEdit(){

  let item=state.items.find(x=>x.id===editingId);

  if(!item) return;

  let name=document.getElementById("editName").value.trim();

  if(!name){
    alert("Item name cannot be empty.");
    return;
  }

  item.name=name;
  item.qty=numberValue(document.getElementById("editQty").value);
  item.minimum=numberValue(document.getElementById("editMinimum").value);

  save();

  closeModal();
  renderAll();
}

function closeModal(){
  document.getElementById("modal").classList.add("hidden");
  editingId=null;
}

function deleteItem(id){

  if(!confirm("Delete this inventory item?")) return;

  state.items=state.items.filter(x=>x.id!==id);

  save();
  renderAll();
}

function issueStock(){

  let id=Number(document.getElementById("issueItem").value);
  let qty=numberValue(document.getElementById("issueQty").value);

  let item=state.items.find(x=>x.id===id);

  if(!item){
    alert("Select an item.");
    return;
  }

  if(qty<=0){
    alert("Enter a valid quantity.");
    return;
  }

  if(qty>item.qty){
    alert("There is not enough stock.");
    return;
  }

  item.qty-=qty;

  state.issues.push({
    id:Date.now(),
    item:item.name,
    qty:qty,
    date:new Date().toLocaleString()
  });

  save();

  document.getElementById("issueQty").value="";

  renderAll();
}

function renderInventory(){

  let table=document.getElementById("inventoryTable");

  table.innerHTML="";

  state.items.forEach(item=>{

    let low=item.qty<=item.minimum;

    table.innerHTML+=`
      <tr>
        <td><b>${escapeHtml(item.name)}</b></td>
        <td>${displayQty(item.qty)}</td>
        <td>${displayQty(item.minimum)}</td>
        <td>
          <span class="${low?'low':'good'}">
            ${low?'LOW':'GOOD'}
          </span>
        </td>
        <td>
          <button class="btn" onclick="editItem(${item.id})">Edit</button>
          <button class="btn danger" onclick="deleteItem(${item.id})">Delete</button>
        </td>
      </tr>
    `;
  });
}

function renderIssueSelect(){

  let select=document.getElementById("issueItem");

  select.innerHTML="";

  state.items.forEach(item=>{
    select.innerHTML+=`
      <option value="${item.id}">
        ${escapeHtml(item.name)} — ${displayQty(item.qty)}
      </option>
    `;
  });
}

function renderIssues(){

  let table=document.getElementById("issueTable");

  table.innerHTML="";

  [...state.issues].reverse().forEach(x=>{

    table.innerHTML+=`
      <tr>
        <td>${escapeHtml(x.item)}</td>
        <td>${displayQty(x.qty)}</td>
        <td>${x.date}</td>
      </tr>
    `;
  });
}

function renderAlerts(){

  let box=document.getElementById("alertList");

  let low=state.items.filter(x=>x.qty<=x.minimum);

  if(low.length===0){
    box.innerHTML="<p class='good'>✓ No low-stock items.</p>";
    return;
  }

  box.innerHTML=low.map(x=>`
    <div class="card">
      <b>${escapeHtml(x.name)}</b>
      <br>
      Current stock: <span class="low">${displayQty(x.qty)}</span>
      <br>
      Minimum: ${displayQty(x.minimum)}
    </div>
  `).join("");
}

function renderReport(){

  let table=document.getElementById("reportTable");

  table.innerHTML="";

  state.items.forEach(x=>{

    let low=x.qty<=x.minimum;

    table.innerHTML+=`
      <tr>
        <td>${escapeHtml(x.name)}</td>
        <td>${displayQty(x.qty)}</td>
        <td>${displayQty(x.minimum)}</td>
        <td class="${low?'low':'good'}">
          ${low?'LOW':'GOOD'}
        </td>
      </tr>
    `;
  });

  document.getElementById("reportDate").textContent=
    "Generated: "+new Date().toLocaleString();
}

function renderDashboard(){

  document.getElementById("totalItems").textContent=
    state.items.length;

  document.getElementById("totalStock").textContent=
    displayQty(state.items.reduce((a,b)=>a+Number(b.qty),0));

  document.getElementById("lowStock").textContent=
    state.items.filter(x=>x.qty<=x.minimum).length;

  document.getElementById("totalIssued").textContent=
    displayQty(state.issues.reduce((a,b)=>a+Number(b.qty),0));
}

function renderAll(){

  renderInventory();
  renderIssueSelect();
  renderIssues();
  renderAlerts();
  renderReport();
  renderDashboard();
}

function showPage(id,button){

  document.querySelectorAll("main>section")
    .forEach(x=>x.classList.add("hidden"));

  document.getElementById(id).classList.remove("hidden");

  document.querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");
}

function updateClock(){

  let now=new Date();

  document.getElementById("clock").innerHTML=
    now.toLocaleDateString()+"<br>"+
    now.toLocaleTimeString();
}

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

updateClock();
setInterval(updateClock,1000);

renderAll();

</script>

</body>
</html>
