<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>UYAN Inventory</title><style>
:root{--gold:#c8a951;--bg:#f5f5f2;--ink:#171717;--muted:#6f6f6f;--card:#fff;--danger:#b42318;--ok:#18794e;--line:#e5e2d8}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#111}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0008;text-align:center}.login-card img{width:170px;max-height:120px;object-fit:contain}.login-card h1{margin:8px 0 4px}.login-card p{color:var(--muted)}.field{display:grid;gap:6px;margin:12px 0;text-align:left}.field input,.field select{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.primary{background:var(--gold);color:#111;padding:12px 16px;border-radius:10px;font-weight:700}.app{min-height:100vh}.top{height:70px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:48px;object-fit:contain}.brand b{letter-spacing:.5px}.top small{color:#ccc}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}aside{background:#181818;color:#fff;padding:14px;display:flex;flex-direction:column;gap:6px}.nav{padding:11px 12px;background:transparent;color:#ddd;text-align:left;border-radius:9px}.nav.active,.nav:hover{background:#2a2a2a;color:#fff}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.page-title h2{margin:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.metric{font-size:28px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.danger{color:var(--danger)}.ok{color:var(--ok)}.section{margin-top:18px}.section h3{margin:0 0 10px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{background:#faf9f4}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}.pill.low{background:#fee4e2;color:var(--danger)}.pill.warn{background:#fff0c2;color:#765500}.pill.ok{background:#def7ec;color:var(--ok)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:9px}.secondary{background:#eee;padding:10px 13px;border-radius:9px}.danger-btn{background:#fee4e2;color:var(--danger);padding:10px 13px;border-radius:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.alert-list{display:grid;gap:8px}.alert{border-left:4px solid var(--danger);background:#fff;padding:12px;border-radius:8px;border:1px solid var(--line)}.alert strong{display:block}.signature{min-width:140px}.report-head{display:none}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}.modal-card{background:#fff;border-radius:16px;width:min(600px,100%);padding:20px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#eee;border-radius:50%;width:34px;height:34px}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 15px;border-radius:10px;z-index:30;display:none}.mobile-nav{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111;padding:7px;z-index:10;gap:4px;overflow:auto}.mobile-nav .nav{flex:1;min-width:82px;text-align:center;font-size:11px}.main{padding:15px 12px 85px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.top{height:62px}.brand img{width:48px;height:40px}}
@media print{body{background:#fff}.top,aside,.mobile-nav,.toolbar,.no-print,.page-title button{display:none!important}.layout{display:block}.main{padding:0;max-width:none}.report-head{display:block;text-align:center;margin-bottom:15px}.card{border:0}.table-wrap{border:0}.table{min-width:0}.table th,.table td{padding:7px}.section{margin-top:12px}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><img src="assets/uyan_logo.png"><h1>UYAN Inventory</h1><p>Restaurant Store Control</p><div class="field"><label>Role</label><select id="loginRole"><option value="admin">Admin</option><option value="storekeeper">Storekeeper</option></select></div><div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Prototype password"></div><button class="primary" style="width:100%" onclick="login()">Sign in</button><p class="muted">Prototype login: any password</p></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><img src="assets/uyan_logo.png"><div><b>UYAN Inventory</b><br><small id="roleText"></small></div></div><button class="secondary" onclick="logout()">Sign out</button></header><div class="layout"><aside id="side"></aside><main class="main"><div id="content"></div></main></div><nav id="mobileNav" class="mobile-nav"></nav></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script>
const KEY='uyan_inventory_web_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{items:[{id:1,name:'Rice',cat:'Food',unit:'kg',qty:35,min:15},{id:2,name:'Chicken',cat:'Food',unit:'pcs',qty:24,min:10},{id:3,name:'Palm Oil',cat:'Food',unit:'L',qty:4,min:5},{id:4,name:'Guinness',cat:'Drinks',unit:'crates',qty:8,min:4},{id:5,name:'Coca-Cola',cat:'Drinks',unit:'bottles',qty:8,min:10}],issues:[],receipts:[],movements:[],user:null};let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function login(){state.user=document.getElementById('loginRole').value;save();showApp()}function logout(){state.user=null;save();document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('roleText').textContent=state.user==='admin'?'Administrator':'Storekeeper';renderNav();render()}
const nav=[['dashboard','Dashboard'],['inventory','Inventory'],['issues','Daily Issues'],['alerts','Low Stock'],['reports','Weekly Reports']];function renderNav(){let html=nav.map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('side').innerHTML=html+(state.user==='admin'?'<button class="nav" onclick="resetDemo()">Reset Demo Data</button>':'');document.getElementById('mobileNav').innerHTML=html}function go(p){page=p;renderNav();render()}
function render(){const c=document.getElementById('content');if(page==='dashboard')dashboard(c);if(page==='inventory')inventory(c);if(page==='issues')issues(c);if(page==='alerts')alerts(c);if(page==='reports')reports(c)}
function lowItems(){return state.items.filter(i=>i.qty<=i.min)}function dashboard(c){let low=lowItems(),today=new Date().toISOString().slice(0,10),tod=state.issues.filter(x=>x.date===today),pending=tod.filter(x=>!x.confirmed).length;c.innerHTML=`<div class="page-title"><h2>Dashboard</h2><span class="muted">${new Date().toLocaleDateString()}</span></div><div class="cards"><div class="card"><div class="muted">Total Items</div><div class="metric">${state.items.length}</div></div><div class="card"><div class="muted">Low Stock</div><div class="metric danger">${low.length}</div></div><div class="card"><div class="muted">Today's Issues</div><div class="metric">${tod.length}</div></div><div class="card"><div class="muted">Awaiting Confirmation</div><div class="metric">${pending}</div></div></div><div class="section grid2"><div class="form-card"><h3>🔔 Low Stock Alerts</h3>${low.length?`<div class="alert-list">${low.slice(0,6).map(i=>`<div class="alert"><strong>${i.name}</strong><span>${i.qty} ${i.unit} remaining · minimum ${i.min} ${i.unit}</span></div>`).join('')}</div>`:'<p class="ok">All stock levels are healthy.</p>'}</div><div class="form-card"><h3>Today's Issue Confirmation</h3>${tod.length?`<div class="alert-list">${tod.slice(0,6).map(x=>`<div class="alert" style="border-left-color:${x.confirmed?'#18794e':'#c8a951'}"><strong>${x.item}</strong><span>${x.qty} ${x.unit} → ${x.department} · ${x.confirmed?'Confirmed':'Awaiting confirmation'}</span></div>`).join('')}</div>`:'<p class="muted">No issues recorded today.</p>'}</div></div>`}
function inventory(c){c.innerHTML=`<div class="page-title"><h2>Inventory</h2>${state.user==='storekeeper'?'<button class="primary" onclick="openItem()">+ Add Item</button>':''}</div><div class="toolbar"><input id="search" placeholder="Search item..." oninput="renderInventoryTable()"><select id="cat" onchange="renderInventoryTable()"><option value="">All categories</option><option>Food</option><option>Drinks</option><option>Supplies</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Category</th><th>Current</th><th>Minimum</th><th>Status</th><th>Action</th></tr></thead><tbody id="invBody"></tbody></table></div>`;renderInventoryTable()}
function renderInventoryTable(){let s=(document.getElementById('search')?.value||'').toLowerCase(),cat=document.getElementById('cat')?.value||'',arr=state.items.filter(i=>(!s||i.name.toLowerCase().includes(s))&&(!cat||i.cat===cat));document.getElementById('invBody').innerHTML=arr.map(i=>{let st=i.qty===0?'<span class="pill low">OUT</span>':i.qty<=i.min?'<span class="pill low">LOW</span>':i.qty<=i.min*1.25?'<span class="pill warn">WATCH</span>':'<span class="pill ok">OK</span>';return `<tr><td><b>${i.name}</b></td><td>${i.cat}</td><td>${i.qty} ${i.unit}</td><td>${i.min} ${i.unit}</td><td>${st}</td><td>${state.user==='storekeeper'?`<button class="secondary" onclick="openStock(${i.id})">Stock</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6">No items.</td></tr>'}
function openItem(){modal(`<h3>Add Inventory Item</h3><div class="field"><label>Name</label><input id="fName"></div><div class="field"><label>Category</label><select id="fCat"><option>Food</option><option>Drinks</option><option>Supplies</option></select></div><div class="field"><label>Unit</label><input id="fUnit" placeholder="kg, bottles, crates..."></div><div class="field"><label>Opening quantity</label><input id="fQty" type="number" value="0"></div><div class="field"><label>Low-stock minimum</label><input id="fMin" type="number" value="5"></div><button class="primary" onclick="addItem()">Save</button>`)}function addItem(){let i={id:Date.now(),name:v('fName'),cat:v('fCat'),unit:v('fUnit'),qty:+v('fQty'),min:+v('fMin')};if(!i.name||!i.unit)return toast('Enter item name and unit');state.items.push(i);save();closeModal();toast('Item added');render()}
function openStock(id){let i=state.items.find(x=>x.id===id);modal(`<h3>Update Stock — ${i.name}</h3><div class="field"><label>Quantity received</label><input id="receive" type="number" value="0"></div><div class="field"><label>Quantity adjustment</label><input id="adjust" type="number" value="0"></div><button class="primary" onclick="applyStock(${id})">Save Movement</button>`)}function applyStock(id){let i=state.items.find(x=>x.id===id),r=+v('receive')||0,a=+v('adjust')||0;if(r===0&&a===0)return toast('Enter a movement');i.qty+=r+a;state.movements.push({date:today(),item:i.name,type:r?'Received':'Adjustment',qty:r+a,by:state.user});save();closeModal();toast('Stock updated');render()}
function issues(c){let arr=state.issues.slice().reverse();c.innerHTML=`<div class="page-title"><h2>Daily Stock Issues</h2>${state.user==='storekeeper'?'<button class="primary" onclick="openIssue()">+ Issue Stock</button>':''}</div><div class="toolbar"><input type="date" id="issueDate" value="${today()}" onchange="renderIssueTable()"><button class="secondary" onclick="window.print()">🖨 Print Daily Sheet</button></div><div class="report-head"><img src="assets/uyan_logo.png" style="width:120px"><h2>UYAN RESTAURANT BAR & LOUNGE</h2><h3>DAILY STOCK ISSUE SHEET</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Department</th><th>Issued By</th><th>Received By</th><th>Confirmation</th><th>Signature</th></tr></thead><tbody id="issueBody"></tbody></table></div>`;renderIssueTable()}
function renderIssueTable(){let d=document.getElementById('issueDate')?.value||today(),arr=state.issues.filter(x=>x.date===d).slice().reverse();document.getElementById('issueBody').innerHTML=arr.map(x=>`<tr><td>${x.date}</td><td>${x.item}</td><td>${x.qty} ${x.unit}</td><td>${x.department}</td><td>${x.by}</td><td>${x.receiver||'—'}</td><td>${x.confirmed?'<span class="pill ok">Confirmed</span>':`<button class="secondary no-print" onclick="confirmIssue(${x.id})">Confirm</button>`}</td><td class="signature">${x.confirmed?'________________':'________________'}</td></tr>`).join('')||'<tr><td colspan="8">No issues for this date.</td></tr>'}
function openIssue(){modal(`<h3>Issue Stock</h3><div class="field"><label>Item</label><select id="iItem">${state.items.map(i=>`<option value="${i.id}">${i.name} (${i.qty} ${i.unit})</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input id="iQty" type="number" min="1"></div><div class="field"><label>Department</label><select id="iDept"><option>Kitchen</option><option>Bar</option></select></div><div class="field"><label>Receiver name (Chef / Bar representative)</label><input id="iReceiver"></div><button class="primary" onclick="createIssue()">Record Issue</button>`)}function createIssue(){let i=state.items.find(x=>x.id==v('iItem')),q=+v('iQty'),dep=v('iDept'),rec=v('iReceiver');if(!q||q>i.qty)return toast('Invalid quantity');i.qty-=q;let x={id:Date.now(),date:today(),item:i.name,unit:i.unit,qty:q,department:dep,receiver:rec,by:'Storekeeper',confirmed:false};state.issues.push(x);state.movements.push({date:today(),item:i.name,type:'Issued to '+dep,qty:-q,by:'Storekeeper'});save();closeModal();toast('Issue recorded');render()}
function confirmIssue(id){let x=state.issues.find(x=>x.id===id);x.confirmed=true;x.confirmedAt=new Date().toLocaleTimeString();save();toast('Issue confirmed');render()}
function alerts(c){let low=lowItems();c.innerHTML=`<div class="page-title"><h2>Low Stock Alerts</h2></div>${low.length?`<div class="alert-list">${low.map(i=>`<div class="alert"><strong>${i.qty===0?'🚨 OUT OF STOCK':'🔴 LOW STOCK'} — ${i.name}</strong><span>Current: ${i.qty} ${i.unit} · Minimum: ${i.min} ${i.unit} · Category: ${i.cat}</span></div>`).join('')}</div>`:'<div class="card"><span class="ok">✓ No low-stock items right now.</span></div>'}<div class="section card"><b>How alerts work</b><p class="muted">Each item has its own minimum level. When current stock reaches or falls below that level, the item appears here for both Admin and Storekeeper.</p></div>`}
function reports(c){let end=new Date(),start=new Date();start.setDate(end.getDate()-6);let arr=state.movements.filter(m=>new Date(m.date)>=new Date(start.toISOString().slice(0,10)));let received=arr.filter(x=>x.type==='Received'),issued=arr.filter(x=>x.type.startsWith('Issued'));c.innerHTML=`<div class="page-title"><h2>Weekly Report</h2><button class="secondary" onclick="window.print()">🖨 Print / Save PDF</button></div><div class="report-head"><img src="assets/uyan_logo.png" style="width:120px"><h2>UYAN RESTAURANT BAR & LOUNGE</h2><h3>WEEKLY INVENTORY REPORT</h3><p>${start.toLocaleDateString()} — ${end.toLocaleDateString()}</p></div><div class="cards"><div class="card"><div class="muted">Items Received</div><div class="metric">${received.length}</div></div><div class="card"><div class="muted">Issue Transactions</div><div class="metric">${issued.length}</div></div><div class="card"><div class="muted">Low Stock Now</div><div class="metric danger">${lowItems().length}</div></div><div class="card"><div class="muted">Unconfirmed Issues</div><div class="metric">${state.issues.filter(x=>!x.confirmed&&new Date(x.date)>=new Date(start.toISOString().slice(0,10))).length}</div></div></div><div class="section"><h3>Stock Movement</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Item</th><th>Movement</th><th>Quantity</th><th>By</th></tr></thead><tbody>${arr.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.item}</td><td>${x.type}</td><td>${x.qty}</td><td>${x.by}</td></tr>`).join('')||'<tr><td colspan="5">No movement recorded this week.</td></tr>'}</tbody></table></div></div>`}
function today(){return new Date().toISOString().slice(0,10)}function v(id){return document.getElementById(id)?.value||''}function modal(body){document.getElementById('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><div></div><button class="close" onclick="closeModal()">×</button></div>${body}</div>`;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function resetDemo(){if(confirm('Reset demo data?')){localStorage.removeItem(KEY);location.reload()}}
</script></body></html>
